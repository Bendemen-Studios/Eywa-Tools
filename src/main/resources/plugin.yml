name: EywaTools
version: 1.2.1
main: com.eywamc.eywatools.EywaTools
api-version: '26.3'
author: Bendemen Studios
description: Custom tool protections and repair utilities for EywaMC.
softdepend:
  - Enchantify
commands:
  eywatools:
    description: Manage EywaTools blocked tools and repair stones.
    usage: /eywatools [gui|reload|give-repairstone <player>]
    permission: eywatools.admin
permissions:
  eywatools.admin:
    description: Allows managing blocked tools and giving repair stones.
    default: op
