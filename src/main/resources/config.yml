# EywaTools configuration
# Add Oraxen item IDs and display names for tools that must not be enchanted.
enchanting-disabled:
  - unobtanium_pickaxe

match-display-name-fallback: true
blocked-display-names:
  - "Unobtanium Pickaxe"

repair-stone:
  material: AMETHYST_SHARD
  name: "&b&lEywaMC Repair Stone"
  lore:
    - "&7Right-click while holding any damaged tool or armor"
    - "&7in your other hand to fully repair it."
    - "&8Consumed on use"

messages:
  enchanting-disabled: "&cYou cannot enchant this tool."
  repair-invalid-target: "&cHold a repairable tool or piece of armor in your other hand."
  repair-not-damaged: "&eThis item does not need repairing."
  repair-success: "&aYour item has been fully repaired!"
