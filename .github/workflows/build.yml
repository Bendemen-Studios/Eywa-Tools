name: Build EywaTools

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EywaTools-1.1.0-Paper-26.3
          path: target/EywaTools-1.1.0.jar
          if-no-files-found: error
